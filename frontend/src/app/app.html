<p-toast />

<div class="app-shell">
  <header class="app-header">
    <svg class="flag-icon" viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="3" height="2" fill="#FFFFFF" />
      <rect width="1" height="2" fill="#D91023" />
      <rect x="2" width="1" height="2" fill="#D91023" />
    </svg>
    <h1>Consulta Inteligente del Código Procesal Penal del Perú</h1>
  </header>

  <section class="chat-section">
    <app-chat-window [messages]="messages()" [loading]="loading()" />
  </section>

  <footer class="input-section">
    <app-chat-input
      [disabled]="loading()"
      [uploading]="uploading()"
      (send)="onSend($event)"
      (filesSelected)="onFilesSelected($event)"
    />
  </footer>
</div>
