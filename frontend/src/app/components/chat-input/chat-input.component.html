<div class="chat-input-bar">
  <p-fileUpload
    mode="basic"
    name="files"
    accept=".pdf"
    [multiple]="true"
    [auto]="true"
    [customUpload]="true"
    chooseIcon="pi pi-paperclip"
    chooseLabel=""
    [disabled]="disabled || uploading"
    styleClass="attach-button"
    pTooltip="Subir PDFs para el asistente"
    tooltipPosition="top"
    (uploadHandler)="onUploadHandler($event)"
  />

  <textarea
    pTextarea
    class="question-input"
    [(ngModel)]="question"
    (keydown)="onKeydown($event)"
    [disabled]="disabled"
    [autoResize]="true"
    rows="1"
    placeholder="Escribe tu pregunta..."
  ></textarea>

  <p-button
    label="Consulta Penal"
    [disabled]="!canSend"
    [loading]="disabled"
    (onClick)="onSend()"
    pTooltip="Enviar consulta"
    tooltipPosition="top"
  >
    <ng-template #icon>
      <svg class="flag-icon" viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="3" height="2" fill="#FFFFFF" />
        <rect width="1" height="2" fill="#D91023" />
        <rect x="2" width="1" height="2" fill="#D91023" />
      </svg>
    </ng-template>
  </p-button>
</div>
